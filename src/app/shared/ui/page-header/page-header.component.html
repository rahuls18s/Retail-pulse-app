<section class="page-heading">
  <div>
    <p class="eyebrow">{{ eyebrow() }}</p>
    <h1>{{ title() }}</h1>
    <p class="subtitle">{{ subtitle() }}</p>
  </div>
  @if (actionLabel()) {
    <button
      class="primary-button"
      (click)="action.emit()"
    >
      {{ actionLabel() }}
    </button>
  }
</section>
